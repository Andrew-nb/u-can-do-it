<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="自律">
    <meta name="theme-color" content="#fafaf6">
<link rel="apple-touch-icon" sizes="180x180" href="icon-v2.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-v2.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-v2.png">
    <script>
    // Register SW early so it can intercept manifest.json?uid=xxx requests.
    // Then set the manifest link href with uid param.
    (function() {
        var uid = new URLSearchParams(window.location.search).get('uid')
                || localStorage.getItem('uid')
                || (function() {
                    var m = document.cookie.match(/(?:^|; )uid=([^;]*)/);
                    return m ? decodeURIComponent(m[1]) : '';
                })();

        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        function setManifest() {
            var link = document.createElement('link');
            link.rel = 'manifest';
            if (uid) {
                link.href = 'manifest.json?uid=' + encodeURIComponent(uid);
            } else {
                link.href = 'manifest.json';
            }
            document.head.appendChild(link);
        }

        if ('serviceWorker' in navigator && !isIOS && uid) {
            // Register SW first, wait for it to control the page, then add manifest
            navigator.serviceWorker.register('./sw.js').then(function(reg) {
                // If SW is already active and controlling, set manifest immediately
                if (navigator.serviceWorker.controller) {
                    setManifest();
                    return;
                }
                // Wait for the SW to activate
                var sw = reg.installing || reg.waiting || reg.active;
                if (sw) {
                    sw.addEventListener('statechange', function() {
                        if (sw.state === 'activated') {
                            // Claim clients so this page is controlled
                            setManifest();
                        }
                    });
                }
            }).catch(function() {
                // Fallback: set manifest anyway
                setManifest();
            });
        } else if (!isIOS && 'serviceWorker' in navigator) {
            // No uid, register SW normally and set static manifest
            navigator.serviceWorker.register('./sw.js').catch(function() {});
            setManifest();
        } else {
            // iOS or no SW support: just set manifest
            setManifest();
        }
    })();
    </script>
<title>自律</title>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen pb-24">
    <!-- Sleep Check-in Page -->
    <div id="sleepPage" class="page-content active">
        <div class="container">
            <div class="greeting">
                <div class="eyebrow" id="sleepEyebrow">— TONIGHT —</div>
                <h2 id="sleepGreeting"></h2>
                <p class="greet-sub" id="sleepGreetSub">该睡了。今天平凡，平凡也很好。</p>
            </div>

            <div class="sleep-card">
                <div class="sleep-card-top">
                    <div class="sleep-clock-row">
                        <div id="sleepTimeDisplay" class="sleep-time">--:--:--</div>
                        <button id="sleepCheckInBtn" class="sleep-circle-btn">
                            <span class="sleep-btn-icon-wrap">
                                <svg class="sleep-btn-icon icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                <svg class="sleep-btn-icon icon-check" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                            <span class="sleep-btn-label">现在入睡</span>
                        </button>
                    </div>
                </div>

                <div class="sleep-chart-wrap">
                    <div class="chart-header">
                        <h3 class="chart-title"><span>入睡时间</span><span>趋势曲线</span></h3>
                        <div class="time-range-group">
                            <button class="time-range-btn active" data-range="week">本周</button>
                            <button class="time-range-btn" data-range="month">本月</button>
                            <button class="time-range-btn" data-range="halfYear">半年</button>
                            <button class="time-range-btn" data-range="year">一年</button>
                        </div>
                    </div>
                    <div id="sleepChart" style="width: 100%; height: 400px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Habit Check-in Page -->
    <div id="habitPage" class="page-content">
        <div class="container">
            <div class="page-header">
                <div class="page-header-left">
                    <div class="eyebrow">— TODAY —</div>
                    <h2 class="page-title">今日 <em>习惯</em></h2>
                    <p class="page-sub" id="habitWeekInfo"></p>
                    <span id="habitDate" class="hidden-meta"></span>
                </div>
                <button id="addHabitBtn" class="add-habit-btn" title="添加新习惯">
                    <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <span>添加习惯</span>
                </button>
            </div>

            <div id="habitList" class="habit-grid"></div>

            <div id="emptyHabitState" class="empty-state hidden">
                <svg viewBox="0 0 24 24" fill="none" width="48" height="48"><path d="M9 12h6M9 16h6M9 8h6M5 21h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <p class="empty-title">还没有添加任何习惯</p>
                <p class="empty-sub">点击上方按钮添加你的第一个习惯</p>
            </div>
        </div>
    </div>

    <!-- Check-in Records Page -->
    <div id="recordPage" class="page-content">
        <div class="container">
            <div class="page-header page-header-center">
                <div class="eyebrow">— ARCHIVE —</div>
                <h2 class="page-title">缺卡 <em>记录</em></h2>
                <p class="page-sub">查看你的历史记录</p>
            </div>

            <div class="record-card">
                <div class="month-nav">
                    <button id="prevMonth" class="month-arrow" title="上月">
                        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <h3 id="currentMonth" class="month-title"></h3>
                    <button id="nextMonth" class="month-arrow" title="下月">
                        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>

                <div id="calendarGrid" class="calendar-grid">
                    <div class="weekday-header">一</div>
                    <div class="weekday-header">二</div>
                    <div class="weekday-header">三</div>
                    <div class="weekday-header">四</div>
                    <div class="weekday-header">五</div>
                    <div class="weekday-header">六</div>
                    <div class="weekday-header">日</div>
                </div>

                <div class="legend-section">
                    <h4 class="legend-title">颜色说明</h4>
                    <div class="legend-grid">
                        <div class="legend-item">
                            <div class="legend-swatch" style="background-color:#5d7a64"></div>
                            <span class="legend-label">完美（0次）</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-swatch" style="background-color:#a8854a"></div>
                            <span class="legend-label">良好（&lt;2次）</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-swatch" style="background-color:#c2410c"></div>
                            <span class="legend-label">一般（2-3次）</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-swatch" style="background-color:#8b1a1a"></div>
                            <span class="legend-label">严重（&gt;3次）</span>
                        </div>
                    </div>
                </div>
            </div>

            <p class="signature">由 <span class="sig-name">pyttt</span> vibe coding 生成</p>
        </div>
    </div>

    <!-- Add Habit Modal -->
    <div id="addHabitModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">添加 <em>新习惯</em></h3>
                <button id="closeModalBtn" class="modal-close" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <form id="addHabitForm">
                <div class="form-row">
                    <label class="form-label">习惯名称</label>
                    <input type="text" id="habitName" class="form-input" placeholder="例如：喝水、运动" required>
                </div>
                <div class="form-row">
                    <label class="form-label">打卡类型</label>
                    <select id="habitType" class="form-input">
                        <option value="daily">每天打卡</option>
                        <option value="weekly" selected>每周打卡指定次数</option>
                    </select>
                </div>
                <div class="form-row" id="frequencyGroup">
                    <label class="form-label">每周打卡次数</label>
                    <input type="number" id="habitFrequency" class="form-input" min="1" max="7" value="3" required>
                    <p class="form-hint">设置每周需要完成的次数（1-7次）</p>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">确认添加</button>
                    <button type="button" id="cancelModalBtn" class="btn-secondary">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Floating Bottom Navigation -->
    <nav class="floating-nav" id="floatingNav">
        <button id="navSleep" class="nav-btn active" title="睡眠">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="navHabit" class="nav-btn" title="习惯">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="navRecord" class="nav-btn" title="记录">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="nav-divider"></span>
        <button id="syncIndicator" class="nav-btn sync-btn" title="云同步">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
